# Builds the APK on GitHub's servers and attaches it to a release,
# so it can be downloaded straight onto the Boox from the repo's Releases page.
name: Build APK

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Build debug APK
        run: |
          chmod +x gradlew
          set -o pipefail
          ./gradlew --no-daemon assembleDebug 2>&1 | tee build.log

      - name: Render test (catches crashes before release)
        run: |
          set -o pipefail
          ./gradlew --no-daemon testDebugUnitTest --tests "com.calendarviewbox.BoardRenderTest" 2>&1 | tee -a build.log

      # Layout pictures for review. Never blocks a release.
      - name: Screenshots
        continue-on-error: true
        run: ./gradlew --no-daemon testDebugUnitTest --tests "com.calendarviewbox.BoardScreenshotTest"

      # If the build fails, keep the log on a separate branch so it can be read and fixed.
      - name: Save build log
        if: failure()
        run: |
          tail -c 300000 build.log > /tmp/build.log || echo "no log" > /tmp/build.log
          git config user.name "github-actions"
          git config user.email "github-actions@users.noreply.github.com"
          git checkout --orphan build-logs
          git rm -rf --cached . > /dev/null
          cp /tmp/build.log build.log
          git add build.log
          git commit -m "Build log for run ${{ github.run_number }}"
          git push -f origin build-logs

      - name: Publish to the Releases page
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          cp app/build/outputs/apk/debug/app-debug.apk CalendarViewBox.apk
          TAG="build-${{ github.run_number }}"
          gh release create "$TAG" CalendarViewBox.apk \
            --title "Calendar View Box ($TAG)" \
            --notes "Built from commit ${{ github.sha }}. Download CalendarViewBox.apk on the Boox and tap it to install." \
            --latest

      # Pictures of the board at several screen sizes, kept on the "screenshots" branch for review.
      - name: Save screenshots
        if: always()
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          if ls app/build/screenshots/*.png >/dev/null 2>&1; then
            git clone --depth 1 "https://x-access-token:${GH_TOKEN}@github.com/${{ github.repository }}.git" /tmp/shots
            cd /tmp/shots
            git config user.name "github-actions"
            git config user.email "github-actions@users.noreply.github.com"
            git checkout --orphan screenshots
            git rm -rf . > /dev/null
            cp "$GITHUB_WORKSPACE"/app/build/screenshots/*.png .
            git add *.png
            git commit -m "Screenshots for run ${{ github.run_number }}"
            git push -f origin screenshots
          fi
